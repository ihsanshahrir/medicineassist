<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary 56px, secondary, text, destructive, disabled" viewport="740x340" -->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../colors_and_type.css" />
		<link rel="stylesheet" href="_card.css" />
		<style>
			.wrap {
				width: 700px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 14px;
			}
			.row .eyebrow {
				margin-left: auto;
				font-size: 10px;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="wrap">
				<div class="row">
					<button class="btn btn-primary" style="width: 260px">Taken</button>
					<span class="eyebrow">primary · 56px · rest</span>
				</div>
				<div class="row">
					<button class="btn btn-primary" style="width: 260px; background: var(--sage-600)">
						Taken
					</button>
					<span class="eyebrow">hover</span>
				</div>
				<div class="row">
					<button class="btn btn-primary" style="width: 260px; background: var(--sage-800)">
						Taken
					</button>
					<span class="eyebrow">press</span>
				</div>
				<div class="row">
					<button class="btn btn-primary" style="width: 260px" disabled>Taken</button>
					<span class="eyebrow">disabled</span>
				</div>
				<div class="row" style="border-top: 1px solid var(--line); padding-top: 16px">
					<button class="btn btn-secondary">Cancel</button>
					<button class="btn btn-secondary" style="box-shadow: var(--focus-ring)">Focused</button>
					<span class="eyebrow">secondary</span>
				</div>
				<div class="row">
					<button class="btn btn-text">Snooze 15 min</button>
					<button class="btn btn-text">Skip</button>
					<span class="eyebrow">text-only</span>
				</div>
				<div class="row">
					<button class="btn btn-destructive">Delete medicine</button>
					<span class="eyebrow">destructive · confirmation dialogs are reserved for this only</span>
				</div>
			</div>
		</div>
	</body>
</html>
