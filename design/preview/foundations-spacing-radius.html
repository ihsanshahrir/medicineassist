<!doctype html>
<!-- @dsCard group="Foundations" name="Spacing & Radius" subtitle="4pt rhythm · 8 → pill" viewport="720x300" -->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../colors_and_type.css" />
		<link rel="stylesheet" href="_card.css" />
		<style>
			.wrap {
				width: 680px;
				display: flex;
				flex-direction: column;
				gap: 22px;
			}
			.sp-row {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			.sp-bar {
				background: var(--sage-700);
				border-radius: 3px;
				height: 14px;
			}
			.sp-name {
				width: 46px;
				font: 600 12px monospace;
				color: var(--ink-2);
			}
			.sp-px {
				font: 12px monospace;
				color: var(--ink-3);
			}
			.r-row {
				display: flex;
				gap: 16px;
				align-items: flex-end;
			}
			.r-box {
				background: var(--sage-100);
				border: 1.5px solid var(--sage-700);
				width: 64px;
				height: 64px;
				display: flex;
				align-items: center;
				justify-content: center;
				font: 600 11px monospace;
				color: var(--sage-800);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="wrap">
				<div>
					<div class="eyebrow" style="font-size: 12px; margin-bottom: 10px">Spacing scale</div>
					<div style="display: flex; flex-direction: column; gap: 8px">
						<div class="sp-row">
							<div class="sp-name">sp-1</div>
							<div class="sp-bar" style="width: 4px"></div>
							<div class="sp-px">4px</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-2</div>
							<div class="sp-bar" style="width: 8px"></div>
							<div class="sp-px">8px — min gap between tap targets</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-3</div>
							<div class="sp-bar" style="width: 12px"></div>
							<div class="sp-px">12px</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-4</div>
							<div class="sp-bar" style="width: 16px"></div>
							<div class="sp-px">16px</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-6</div>
							<div class="sp-bar" style="width: 24px"></div>
							<div class="sp-px">24px</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-8</div>
							<div class="sp-bar" style="width: 32px"></div>
							<div class="sp-px">32px</div>
						</div>
						<div class="sp-row">
							<div class="sp-name">sp-12</div>
							<div class="sp-bar" style="width: 48px"></div>
							<div class="sp-px">48px</div>
						</div>
					</div>
				</div>

				<div>
					<div class="eyebrow" style="font-size: 12px; margin-bottom: 10px">Corner radius</div>
					<div class="r-row">
						<div class="r-box" style="border-radius: 8px">8 chip</div>
						<div class="r-box" style="border-radius: 12px">12 input</div>
						<div class="r-box" style="border-radius: 16px">16 inner</div>
						<div class="r-box" style="border-radius: 20px">20 card</div>
						<div class="r-box" style="border-radius: 28px">28 sheet</div>
						<div class="r-box" style="border-radius: 999px; width: 64px">pill</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
