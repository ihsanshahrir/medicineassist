<!doctype html>
<!-- @dsCard group="Pictograms" name="Time of Day" subtitle="4 marks · language-independent, recognisable before digits are read" viewport="780x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row { width: 740px; display: flex; gap: 14px; }
  .tile { flex: 1; background: var(--surface); border-radius: 16px; padding: 18px 12px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .tile svg { width: 40px; height: 40px; color: var(--sage-700); }
  .tile b { font-size: 14px; }
  .tile span { font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body><div class="card"><div class="row">

  <div class="tile"><svg><use href="../pictograms.svg#pic-sunrise"/></svg><b>Morning</b><span>Pagi · 6–11am</span></div>
  <div class="tile"><svg><use href="../pictograms.svg#pic-sun"/></svg><b>Afternoon</b><span>Tengah hari · 12–5pm</span></div>
  <div class="tile"><svg><use href="../pictograms.svg#pic-sunset"/></svg><b>Evening</b><span>Petang · 6–9pm</span></div>
  <div class="tile"><svg><use href="../pictograms.svg#pic-moon"/></svg><b>Night</b><span>Malam · 10pm–5am</span></div>

</div></div></body></html>
