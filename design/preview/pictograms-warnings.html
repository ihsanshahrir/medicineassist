<!doctype html>
<!-- @dsCard group="Pictograms" name="Warnings" subtitle="4 marks · rendered in the 'Be careful' block style" viewport="780x300" -->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../colors_and_type.css" />
		<link rel="stylesheet" href="_card.css" />
		<style>
			.panel {
				width: 740px;
				background: var(--warn-bg);
				border: 1.5px solid var(--warn-border);
				border-radius: 18px;
				padding: 18px;
			}
			.panel h4 {
				margin: 0 0 12px;
				font-size: 13px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--warn-text);
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 12px;
			}
			.tile {
				background: var(--surface);
				border-radius: 14px;
				padding: 14px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				text-align: center;
			}
			.tile svg {
				width: 38px;
				height: 38px;
				color: var(--warn-text);
			}
			.tile b {
				font-size: 13.5px;
			}
			.tile span {
				font-size: 11.5px;
				color: var(--ink-2);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="panel">
				<h4>Be careful with this medicine</h4>
				<div class="grid">
					<div class="tile">
						<svg><use href="../pictograms.svg#pic-drowsiness" /></svg><b>May cause drowsiness</b
						><span>Boleh mengantuk</span>
					</div>
					<div class="tile">
						<svg><use href="../pictograms.svg#pic-no-alcohol" /></svg><b>No alcohol</b
						><span>Jangan alkohol</span>
					</div>
					<div class="tile">
						<svg><use href="../pictograms.svg#pic-do-not-drive" /></svg><b>Do not drive</b
						><span>Jangan memandu</span>
					</div>
					<div class="tile">
						<svg><use href="../pictograms.svg#pic-keep-refrigerated" /></svg><b>Keep refrigerated</b
						><span>Simpan di peti sejuk</span>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
