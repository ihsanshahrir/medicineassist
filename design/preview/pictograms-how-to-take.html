<!doctype html>
<!-- @dsCard group="Pictograms" name="How to Take" subtitle="6 marks · EN + BM labels · never shown without text" viewport="780x420" -->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../colors_and_type.css" />
		<link rel="stylesheet" href="_card.css" />
		<style>
			.grid {
				width: 740px;
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 14px;
			}
			.tile {
				background: var(--surface);
				border-radius: 16px;
				padding: 16px;
				box-shadow: var(--shadow-1);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				text-align: center;
			}
			.tile svg {
				width: 44px;
				height: 44px;
				color: var(--sage-700);
			}
			.tile b {
				font-size: 15px;
			}
			.tile span {
				font-size: 12.5px;
				color: var(--ink-2);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="grid">
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-with-food" /></svg><b>With food</b
					><span>Bersama makanan</span>
				</div>
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-before-food" /></svg><b>Before food</b
					><span>Sebelum makan</span>
				</div>
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-empty-stomach" /></svg><b>Empty stomach</b
					><span>Perut kosong</span>
				</div>
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-swallow-whole" /></svg><b>Swallow whole</b
					><span>Telan bulat-bulat</span>
				</div>
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-do-not-crush" /></svg><b>Do not crush</b
					><span>Jangan hancurkan</span>
				</div>
				<div class="tile">
					<svg><use href="../pictograms.svg#pic-shake-first" /></svg><b>Shake first</b
					><span>Goncang dahulu</span>
				</div>
			</div>
		</div>
	</body>
</html>
